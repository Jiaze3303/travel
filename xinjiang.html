<!doctype html>
<html lang="zh-CN">
<head>

  <title>北疆环线 · 9天行程</title>
  <style>
    :root { color-scheme: light; --bg:#f4f4f1; --surface:#fff; --surface-soft:#fafaf7; --grouped:#f1f5f1; --ink:#20211f; --muted:#777b75; --green:#4f806b; --green-dark:#376653; --green-soft:#e8f1eb; --sand:#f7eee2; --line:rgba(42,56,47,.12); --radius:16px; --shadow:0 5px 20px rgba(33,42,35,.06); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
    button,summary { font:inherit; touch-action:manipulation; }
    button:focus-visible,summary:focus-visible { outline:3px solid rgba(79,128,107,.42); outline-offset:3px; }
    .skip { position:absolute; left:12px; top:8px; z-index:20; transform:translateY(-140%); padding:10px 14px; border-radius:10px; background:var(--ink); color:#fff; }
    .skip:focus { transform:none; }
    .wrap { width:min(860px,100%); margin:0 auto; padding:0 16px calc(42px + env(safe-area-inset-bottom)); }
    .hero { padding:26px 0 18px; }
    .eyebrow { margin-bottom:7px; color:var(--green); font-size:12px; font-weight:800; letter-spacing:.12em; }
    h1 { margin:0; font-size:clamp(30px,8vw,42px); line-height:1.14; letter-spacing:-.035em; }
    .hero-sub { margin:9px 0 0; color:var(--muted); font-size:14px; line-height:1.55; }
    .status { margin-top:14px; padding:11px 13px; border-left:3px solid #c7945f; border-radius:11px; background:var(--sand); color:#6e5947; font-size:13px; line-height:1.5; }
    .calendar { position:sticky; top:0; z-index:10; margin:0 -16px; padding:8px 16px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:rgba(244,244,241,.92); backdrop-filter:blur(18px); }
    .dates { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
    .dates::-webkit-scrollbar { display:none; }
    .daybtn { flex:0 0 64px; min-height:56px; padding:7px 5px; border:1px solid transparent; border-radius:13px; background:transparent; color:var(--muted); cursor:pointer; }
    .daybtn .n,.daybtn .city { display:block; text-align:center; }
    .daybtn .n { font-size:19px; font-weight:800; line-height:1.05; }
    .daybtn .city { margin-top:4px; font-size:11px; white-space:nowrap; }
    .daybtn[aria-pressed=true] { border-color:rgba(79,128,107,.5); background:var(--green-soft); color:var(--green-dark); }
    .panel { margin-top:18px; }
    .panel-title { margin:0 0 12px; font-size:22px; letter-spacing:-.02em; }
    .overview-row { display:grid; grid-template-columns:50px minmax(0,1fr) auto; gap:12px; align-items:start; width:100%; min-height:68px; margin-bottom:9px; padding:13px 14px; border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); text-align:left; cursor:pointer; box-shadow:var(--shadow); }
    .overview-row:hover { border-color:rgba(79,128,107,.3); background:var(--green-soft); }
    .date-badge { display:grid; min-height:30px; place-items:center; border-radius:9px; background:var(--green-soft); color:var(--green-dark); font-size:12px; font-weight:800; }
    .overview-main b { display:block; font-size:15px; line-height:1.4; }
    .overview-main span { display:block; margin-top:2px; color:var(--muted); font-size:12px; line-height:1.45; }
    .view-day { align-self:center; color:var(--green); font-size:12px; font-weight:800; white-space:nowrap; }
    .route-strip { margin-top:14px; padding:14px; border:1px solid rgba(79,128,107,.15); border-radius:14px; background:var(--green-soft); }
    .route-strip b { display:block; margin-bottom:7px; color:var(--green-dark); font-size:13px; }
    .route-flow { display:flex; gap:6px; overflow-x:auto; color:var(--ink-soft); font-size:13px; line-height:1.4; scrollbar-width:none; }
    .route-flow span { flex:0 0 auto; }
    .route-flow i { color:var(--green); font-style:normal; }
    .card { overflow:hidden; margin-top:12px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); }
    .card > summary { display:flex; align-items:center; min-height:52px; padding:14px 16px; font-size:15px; font-weight:800; cursor:pointer; list-style:none; }
    .card > summary::-webkit-details-marker { display:none; }
    .card > summary::after { margin-left:auto; color:var(--muted); content:'＋'; font-size:19px; }
    .card[open] > summary::after { content:'−'; }
    .card-body { padding:14px 16px 16px; border-top:1px solid var(--line); background:var(--surface-soft); }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .info-item { min-width:0; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--grouped); }
    .info-item b { display:block; color:var(--green-dark); font-size:13px; line-height:1.4; }
    .info-item span { display:block; margin-top:4px; color:#59615b; font-size:12px; line-height:1.6; overflow-wrap:anywhere; }
    .budget { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .budget .info-item strong { display:block; margin-top:3px; font-size:17px; }
    .detail { display:none; scroll-margin-top:84px; }
    .detail.show { display:block; }
    .detail-head { padding:18px 0 12px; border-left:2px solid var(--green); padding-left:14px; }
    .date-line { color:var(--green); font-size:13px; font-weight:800; letter-spacing:.08em; }
    h2 { margin:5px 0 4px; font-size:clamp(25px,7vw,33px); line-height:1.25; letter-spacing:-.03em; }
    .route { color:var(--muted); font-size:14px; line-height:1.55; }
    .chips { display:flex; gap:8px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none; }
    .chip { flex:0 0 auto; padding:7px 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--green-dark); font-size:12px; }
    .daily-brief { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:4px 0 16px; }
    .brief-item { padding:12px 13px; border:1px solid rgba(79,128,107,.16); border-radius:12px; background:var(--green-soft); }
    .brief-item b { display:block; color:var(--green-dark); font-size:12px; }
    .brief-item span { display:block; margin-top:4px; color:#59615b; font-size:13px; line-height:1.6; }
    .timeline { position:relative; margin:4px 0 18px; }
    .timeline::before { position:absolute; top:18px; bottom:18px; left:66px; width:2px; background:rgba(79,128,107,.22); content:""; transform:translateX(-50%); }
    .event { display:grid; grid-template-columns:56px 20px minmax(0,1fr); gap:10px; padding-bottom:10px; }
    .time { padding-top:13px; color:var(--green); font-size:12px; font-weight:800; line-height:1.35; text-align:right; overflow-wrap:anywhere; }
    .dot { position:relative; z-index:1; width:11px; height:11px; margin:15px auto 0; border:2px solid var(--bg); border-radius:50%; background:var(--green); box-shadow:0 0 0 1px rgba(79,128,107,.26); }
    .event-body { min-height:44px; padding:12px 14px; border:1px solid rgba(60,60,67,.07); border-radius:14px; background:var(--surface); color:var(--ink); font-size:14px; line-height:1.62; box-shadow:0 2px 10px rgba(29,29,31,.04); overflow-wrap:anywhere; }
    .extras { overflow:hidden; margin-top:14px; border:1px solid var(--line); border-radius:14px; background:var(--surface); box-shadow:var(--shadow); }
    .extras > summary { display:flex; min-height:50px; align-items:center; padding:14px 16px; font-size:15px; font-weight:800; cursor:pointer; list-style:none; }
    .extras > summary::-webkit-details-marker { display:none; }
    .extras > summary::after { margin-left:auto; color:var(--muted); content:'＋'; font-size:19px; }
    .extras[open] > summary::after { content:'−'; }
    .extras-body { display:grid; gap:10px; padding:14px 16px 16px; border-top:1px solid var(--line); background:var(--surface-soft); }
    .extras-row { padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--grouped); color:#59615b; font-size:13px; line-height:1.6; }
    .extras-row b { color:var(--green-dark); }
    .nav { display:flex; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--line); }
    .nav button { flex:1; min-height:46px; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--green-dark); cursor:pointer; }
    .nav button:disabled { color:#aaa; cursor:default; opacity:.55; }
    .footer { margin-top:34px; color:var(--muted); font-size:12px; text-align:center; }
    @media (max-width:480px) { .grid,.budget,.daily-brief { grid-template-columns:1fr; } .overview-row { grid-template-columns:45px minmax(0,1fr); } .view-day { grid-column:2; align-self:start; } }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
  </style>

    ];
    const tickets = [{name:'禾木',value:'门票＋区间车 · 75元'},{name:'喀纳斯',value:'门票＋区间车 · 230元'},{name:'世界魔鬼城',value:'门票＋区间车 · 62元'},{name:'赛里木湖',value:'自驾票 · 70元'},{name:'那拉提河谷',value:'河谷＋区间车 · 135元'}];
    const hotels = [{date:'9/27',name:'格林豪泰酒店',place:'乌鲁木齐火车站'},{date:'9/28、9/30',name:'布尔津美居大酒店',place:'布尔津'},{date:'9/29',name:'云驿·观山民宿',place:'禾木'},{date:'10/1',name:'奎屯裕大酒店',place:'奎屯'},{date:'10/2',name:'伊宁呼勒佳酒店',place:'伊宁'},{date:'10/3',name:'娜菲晚察／文明大酒店',place:'那拉提'},{date:'10/4',name:'如家商旅酒店',place:'乌鲁木齐南广场店'}];
    const $ = s => document.querySelector(s); const overviewRows=$('#overviewRows'); const detailRoot=$('#details'); const buttons=[...document.querySelectorAll('.daybtn')];
    const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function renderOverview(){ overviewRows.innerHTML=days.map((d,i)=>`<button class="overview-row" type="button" data-day="${i+1}" aria-label="${esc(d.date)}，查看${esc(d.title)}"><span class="date-badge">${esc(d.date)}</span><span class="overview-main"><b>${esc(d.title)}</b><span>${esc(d.sub)}</span></span><span class="view-day" aria-hidden="true">查看当天 →</span></button>`).join(''); $('#ticketOverview').innerHTML=tickets.map(t=>`<div class="info-item"><b>${esc(t.name)}</b><span>${esc(t.value)}</span></div>`).join(''); $('#hotelOverview').innerHTML=hotels.map(h=>`<div class="info-item"><b>${esc(h.date)} · ${esc(h.name)}</b><span>${esc(h.place)} · 出发前确认入住时间</span></div>`).join(''); }
    function renderDetails(){ detailRoot.innerHTML=days.map((d,i)=>`<section class="detail" data-detail="${i+1}" aria-labelledby="detail-title-${i+1}"><div class="detail-head"><div class="date-line">${esc(d.date)} · 第${i+1}天</div><h2 id="detail-title-${i+1}">${esc(d.title)}</h2><div class="route">${esc(d.sub)}</div></div><div class="chips"><span class="chip">🚐 北疆环线</span>${d.ticket?`<span class="chip">🎫 ${esc(d.ticket)}</span>`:''}<span class="chip">🏨 ${esc(d.hotel||'返程日')}</span></div><div class="daily-brief"><div class="brief-item"><b>关键时间</b><span>${esc(d.brief[0])}</span></div><div class="brief-item"><b>注意事项</b><span>${esc(d.brief[1])}</span></div></div><div class="timeline">${d.events.map(e=>`<div class="event"><span class="time">${esc(e[0])}</span><span class="dot" aria-hidden="true"></span><div class="event-body">${esc(e[1])}</div></div>`).join('')}</div><details class="extras"><summary>路线、门票与住宿</summary><div class="extras-body"><div class="extras-row"><b>当天路线</b><br>${esc(d.route)}</div>${d.ticket?`<div class="extras-row"><b>门票</b><br>${esc(d.ticket)}；特殊证件或优待证按景区规则办理优惠。</div>`:''}<div class="extras-row"><b>住宿</b><br>${esc(d.hotel||'返程，不安排住宿')}</div></div></details><div class="nav"><button type="button" data-nav="${i}" ${i===0?'disabled':''}>← 前一天</button><button type="button" class="home" data-nav="0">回到总览</button><button type="button" data-nav="${i+2}" ${i===days.length-1?'disabled':''}>后一天 →</button></div></section>`).join(''); }
    function show(day,update=true){ day=Math.max(0,Math.min(days.length,Number(day)||0)); document.body.classList.toggle('show-detail',day>0); $('#overview').hidden=day>0; document.querySelectorAll('.detail').forEach(d=>d.classList.toggle('show',Number(d.dataset.detail)===day)); buttons.forEach(b=>{const active=Number(b.dataset.day)===day;b.setAttribute('aria-pressed',String(active));}); $('#status').textContent=day?`${days[day-1].date} · ${days[day-1].title} · 查看当天重点和完整路线`:'9/27–10/5 · 抵达乌鲁木齐 · 北疆环线'; if(update){const u=new URL(location.href);u.searchParams.set('day',String(day));history.replaceState(null,'',u);} const active=buttons.find(b=>Number(b.dataset.day)===day); active?.scrollIntoView({inline:'center',block:'nearest'}); window.scrollTo({top:0,behavior:'smooth'}); }
    renderOverview(); renderDetails(); document.addEventListener('click',e=>{const target=e.target.closest('[data-day],[data-nav]'); if(target){e.preventDefault();show(target.dataset.day??target.dataset.nav,true);}}); show(new URLSearchParams(location.search).get('day')||0,false);
  </script>
</body>
</html>
